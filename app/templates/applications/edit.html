{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Edit Application</h1>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Company
            </label>

            <input
                type="text"
                name="company"
                class="form-control"
                value="{{ application.company }}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Position
            </label>

            <input
                type="text"
                name="position"
                class="form-control"
                value="{{ application.position }}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Job URL
            </label>

            <input
                type="url"
                name="job_url"
                class="form-control"
                value="{{ application.job_url or '' }}"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Location
            </label>

            <input
                type="text"
                name="location"
                class="form-control"
                value="{{ application.location or '' }}"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Status
            </label>

            <select name="status" class="form-select">

                {% for status in statuses %}

                    <option
                        value="{{ status }}"
                        {% if application.status == status %}
                            selected
                        {% endif %}
                    >
                        {{ status }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Application Date
            </label>

            <input
                type="date"
                name="applied_date"
                class="form-control"
                value="{{ application.applied_date or '' }}"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Notes
            </label>

            <textarea
                name="notes"
                class="form-control"
                rows="4"
            >{{ application.notes or '' }}</textarea>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>


        <a
            href="{{ url_for('applications.list_applications') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
