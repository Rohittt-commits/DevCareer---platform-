<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project | DevCareer</title>
</head>
<body>

    <h1>Edit Project</h1>

    <form method="POST">

        <div>
            <label for="title">Project Title</label>
            <br>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ project.title }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="description">Description</label>
            <br>
            <textarea
                id="description"
                name="description"
                rows="5"
                required
            >{{ project.description }}</textarea>
        </div>

        <br>

        <div>
            <label for="tech_stack">Tech Stack</label>
            <br>
            <input
                type="text"
                id="tech_stack"
                name="tech_stack"
                value="{{ project.tech_stack }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="github_url">GitHub URL</label>
            <br>
            <input
                type="url"
                id="github_url"
                name="github_url"
                value="{{ project.github_url or '' }}"
            >
        </div>

        <br>

        <div>
            <label for="live_url">Live Project URL</label>
            <br>
            <input
                type="url"
                id="live_url"
                name="live_url"
                value="{{ project.live_url or '' }}"
            >
        </div>

        <br>

        <div>
            <label for="status">Status</label>
            <br>

            <select id="status" name="status">

                <option
                    value="In Progress"
                    {% if project.status == "In Progress" %}selected{% endif %}
                >
                    In Progress
                </option>

                <option
                    value="Completed"
                    {% if project.status == "Completed" %}selected{% endif %}
                >
                    Completed
                </option>

                <option
                    value="Planned"
                    {% if project.status == "Planned" %}selected{% endif %}
                >
                    Planned
                </option>

                <option
                    value="On Hold"
                    {% if project.status == "On Hold" %}selected{% endif %}
                >
                    On Hold
                </option>

            </select>
        </div>

        <br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('projects.list_projects') }}">
        Cancel
    </a>

</body>
</html>
