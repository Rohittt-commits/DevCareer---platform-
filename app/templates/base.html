<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}DevCareer{% endblock %}
    </title>

    <style>

        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.06),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(17, 24, 39, 0.94);
            backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            padding: 14px 5%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .nav-brand {
            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: 800;

            letter-spacing: -0.5px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .nav-brand::before {
            content: "◆";

            font-size: 14px;
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;

            padding: 8px 12px;
            border-radius: 9px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: white;
            background: rgba(255,255,255,0.09);
        }


        /* =====================================================
           MAIN CONTAINER
        ====================================================== */

        .container {
            width: min(1120px, 92%);
            margin: 38px auto;
        }


        /* =====================================================
           PAGE HEADER
        ====================================================== */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 34px;
            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 5px;
        }

        .page-header p {
            color: var(--muted);
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 10px;

            padding: 11px 17px;

            background: var(--primary);
            color: white;

            text-decoration: none;

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .btn.secondary {
            background: #64748b;
        }

        .btn.secondary:hover {
            background: #475569;
        }

        .btn.danger {
            background: var(--danger);
        }

        .btn.danger:hover {
            background: #b91c1c;
        }


        /* =====================================================
           CARDS
        ====================================================== */

        .project-card,
        .project-detail-card,
        .project-form,
        .empty-state,
        .card,
        .section,
        .form-card {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }

        .project-card {
            padding: 24px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 16px 35px rgba(15, 23, 42, 0.1);
        }

        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 12px;

            margin-bottom: 15px;
        }

        .project-card h2 {
            font-size: 20px;
            font-weight: 750;
        }

        .project-description {
            color: #4b5563;
            margin-bottom: 15px;
        }


        /* =====================================================
           PROJECT GRID
        ====================================================== */

        .projects-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;
        }


        /* =====================================================
           DETAIL CARD
        ====================================================== */

        .project-detail-card {
            padding: 30px;
        }

        .project-detail-card section {
            padding-bottom: 25px;

            margin-bottom: 25px;

            border-bottom:
                1px solid var(--border);
        }

        .project-detail-card section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .project-detail-card h2 {
            margin-bottom: 10px;
        }

        .project-detail-card a {
            color: var(--primary);
            text-decoration: none;
        }


        /* =====================================================
           FORMS
        ====================================================== */

        .project-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select,
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"],
        input[type="date"],
        input[type="number"],
        textarea,
        select {
            width: 100%;

            padding: 12px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            background: white;

            color: var(--text);

            outline: none;

            transition:
                border 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus,
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;
        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {
            display: inline-flex;

            align-items: center;

            padding: 5px 10px;

            border-radius: 999px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 12px;
            font-weight: 700;
        }


        /* =====================================================
           ALERTS
        ====================================================== */

        .alert {
            padding: 13px 16px;

            border-radius: 10px;

            margin-bottom: 20px;

            border: 1px solid transparent;
        }

        .alert.success {
            background: #f0fdf4;
            color: #166534;
            border-color: #bbf7d0;
        }

        .alert.danger {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
        }


        /* =====================================================
           EMPTY STATE
        ====================================================== */

        .empty-state {
            text-align: center;

            padding: 65px 25px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--muted);

            margin-bottom: 25px;
        }

        .empty {
            color: #9ca3af;
        }

        .muted {
            color: var(--muted);
        }


        /* =====================================================
           ACTIONS
        ====================================================== */

        .project-actions {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 20px;
        }

        .project-actions form {
            margin: 0;
        }


        /* =====================================================
           GENERIC TABLE / LIST SUPPORT
        ====================================================== */

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th,
        td {
            padding: 13px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--surface-soft);
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }


        /* =====================================================
           COMMON CARDS FOR LEARNING / GOALS / SKILLS /
           APPLICATIONS
        ====================================================== */

        .learning-card,
        .goal-card,
        .skill-card,
        .application-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 21px;

            box-shadow: 0 7px 22px rgba(15, 23, 42, 0.05);

            transition: 0.2s ease;
        }

        .learning-card:hover,
        .goal-card:hover,
        .skill-card:hover,
        .application-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(15, 23, 42, 0.08);
        }


        /* =====================================================
           PROGRESS
        ====================================================== */

        .progress-container {
            background: #e5e7eb;

            height: 9px;

            border-radius: 999px;

            overflow: hidden;

            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;

            background: var(--primary);

            border-radius: 999px;

            transition: width 0.3s ease;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            nav {
                padding: 13px 4%;

                align-items: flex-start;

                flex-direction: column;
            }

            .nav-links {
                width: 100%;

                overflow-x: auto;

                flex-wrap: nowrap;

                padding-bottom: 3px;
            }

            .nav-links a {
                white-space: nowrap;
            }

            .container {
                width: 94%;

                margin-top: 25px;
            }

            .page-header {
                flex-direction: column;

                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .project-card-header {
                flex-direction: column;
            }

            .project-form,
            .project-detail-card {
                padding: 21px;
            }

            .form-actions {
                justify-content: stretch;

                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <nav>

        <a
            href="{{ url_for('main.home') }}"
            class="nav-brand"
        >
            DevCareer
        </a>

        <div class="nav-links">

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('main.home') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('projects.list_projects') }}">
                    Projects
                </a>

                <a href="{{ url_for('skills.list_skills') }}">
                    Skills
                </a>

                <a href="{{ url_for('applications.list_applications') }}">
                    Applications
                </a>

                <a href="{{ url_for('goals.list_goals') }}">
                    Goals
                </a>

                <a href="{{ url_for('learning.list_learning') }}">
                    Learning
                </a>

                <a href="{{ url_for('auth.logout') }}">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>

                <a href="{{ url_for('auth.register') }}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>

    {% block content %}
    {% endblock %}

</body>

</html>
