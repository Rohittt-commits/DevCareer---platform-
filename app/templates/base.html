<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}DevCareer{% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        nav {
            background: #111827;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6b7280;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn.secondary {
            background: #6b7280;
        }

        .btn.danger {
            background: #dc2626;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 20px;
        }

        .project-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }

        .project-card h2 {
            font-size: 21px;
        }

        .project-description {
            color: #4b5563;
            margin-bottom: 15px;
        }

        .muted {
            color: #9ca3af;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 12px;
            font-weight: 600;
        }

        .project-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .project-actions form {
            margin: 0;
        }

        .project-detail-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .project-detail-card section {
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .project-detail-card section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .project-detail-card h2 {
            margin-bottom: 10px;
        }

        .project-detail-card a {
            color: #2563eb;
            text-decoration: none;
        }

        .project-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
        }

        .alert.danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .project-card-header {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <nav>

        <a
            href="{{ url_for('main.home') }}"
            class="nav-brand"
        >
            DevCareer
        </a>

        <div class="nav-links">

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('main.home') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('projects.list_projects') }}">
                    Projects
                </a>

                <a href="{{ url_for('auth.logout') }}">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>

                <a href="{{ url_for('auth.register') }}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>

    {% block content %}
    {% endblock %}

</body>

</html>
