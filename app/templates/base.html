<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}DevCareer{% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --nav: #111827;
        }

        body {
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        nav {
            background: var(--nav);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        .nav-brand {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .nav-brand span {
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .nav-links a:hover {
            background: #1f2937;
            color: white;
        }

        .nav-links .logout-link {
            color: #fca5a5;
        }

        .nav-links .logout-link:hover {
            background: #3f1d1d;
            color: #fecaca;
        }

        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0;
        }

        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            line-height: 1.2;
            margin-bottom: 6px;
            letter-spacing: -0.7px;
        }

        .page-header p {
            color: var(--muted);
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: #6b7280;
        }

        .btn.secondary:hover {
            background: #4b5563;
        }

        .btn.danger {
            background: var(--danger);
        }

        .btn.danger:hover {
            background: #b91c1c;
        }

        /* =====================================================
           PROJECTS
        ===================================================== */

        .projects-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );
            gap: 20px;
        }

        .project-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.08);
        }

        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }

        .project-card h2 {
            font-size: 21px;
        }

        .project-description {
            color: #4b5563;
            margin-bottom: 15px;
        }

        .muted {
            color: #9ca3af;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 12px;
            font-weight: 700;
        }

        .project-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .project-actions form {
            margin: 0;
        }

        /* =====================================================
           DETAIL / FORM CARDS
        ===================================================== */

        .project-detail-card,
        .project-form {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .project-detail-card {
            padding: 30px;
        }

        .project-detail-card section {
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }

        .project-detail-card section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .project-detail-card h2 {
            margin-bottom: 10px;
        }

        .project-detail-card a {
            color: var(--primary);
            text-decoration: none;
        }

        .project-form {
            padding: 30px;
        }

        /* =====================================================
           FORMS
        ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: white;
            color: var(--text);
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        /* =====================================================
           ALERTS
        ===================================================== */

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        .alert.danger {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty-state {
            background: var(--surface);
            text-align: center;
            padding: 60px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            nav {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                width: 100%;
                justify-content: flex-start;
            }

        }

        @media (max-width: 700px) {

            .container {
                width: 94%;
                margin-top: 25px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .project-card-header {
                flex-direction: column;
            }

            .project-form,
            .project-detail-card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <a
            href="{{ url_for('main.home') }}"
            class="nav-brand"
        >
            Dev<span>Career</span>
        </a>

        <div class="nav-links">

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('main.home') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('projects.list_projects') }}">
                    Projects
                </a>

                <a href="{{ url_for('skills.list_skills') }}">
                    Skills
                </a>

                <a href="{{ url_for('applications.list_applications') }}">
                    Applications
                </a>

                <a href="{{ url_for('goals.list_goals') }}">
                    Goals
                </a>

                <a href="{{ url_for('learning.list_learning') }}">
                    Learning
                </a>

                <a
                    href="{{ url_for('auth.logout') }}"
                    class="logout-link"
                >
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>

                <a href="{{ url_for('auth.register') }}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>

    {% block content %}
    {% endblock %}

</body>

</html>
